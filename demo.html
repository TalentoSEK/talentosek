<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd400">
<style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>TalentoSEK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap">
<style>
/* TalentoSEK. Una columna de móvil; la pizarra Blancos contra Negros es la pieza central y lo demás se queda callado. */
:root{
  --grada:#e7e8ea; --papel:#ffffff; --suave:#f1f2f4; --tinta:#000000; --gris:#5a5d64; --raya:#c6c9cf;
  --amarilla:#ffd400; --sobre-amarilla:#000000; --roja:#c8002a; --cesped:#0a7d45;
  --blanco:#ffffff; --negro:#000000; --gris-en-blanco:#5a5d64; --gris-en-negro:#b3b6be; --raya-en-blanco:#dcdee2; --raya-en-negro:#2e3035;
  --f:"Archivo","Arial Narrow",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --grada:#1c1e22; --papel:#292c32; --suave:#33363d; --tinta:#ffffff; --gris:#a8acb5; --raya:#454952;
    --roja:#ff6176; --cesped:#3fd088; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --grada:#1c1e22; --papel:#292c32; --suave:#33363d; --tinta:#ffffff; --gris:#a8acb5; --raya:#454952;
  --roja:#ff6176; --cesped:#3fd088; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--grada);color:var(--tinta);font:400 16px/1.4 var(--f);font-stretch:100%}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amarilla);outline-offset:2px;box-shadow:0 0 0 5px var(--tinta)}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 112px;display:flex;flex-direction:column;gap:20px}

/* cabecera */
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{font-weight:800;font-stretch:125%;font-size:20px;letter-spacing:-.02em}
.marca b{background:var(--tinta);color:var(--grada);padding:0 5px;margin-left:1px}
.quien{border:1.5px solid var(--tinta);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;min-height:36px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--amarilla);color:var(--sobre-amarilla);margin-inline:-16px;padding:8px 16px;font-size:14px}
.proto label{font-weight:700}
.proto select{background:#fff;color:#000;border:1.5px solid #000;border-radius:6px;padding:4px 8px;min-height:32px;max-width:100%}
.proto p{flex:1 1 100%}

/* textos */
.cuando{font-weight:800;font-stretch:125%;font-size:30px;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.donde{color:var(--gris);max-width:60ch}
.vista{display:flex;flex-direction:column;gap:16px}
.bloque{display:flex;flex-direction:column;gap:10px}
h2{font-weight:800;font-stretch:125%;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
.nota{color:var(--gris);font-size:14px;max-width:60ch}
.aviso{font-weight:600}
.aviso.mal{color:var(--roja)}
.aviso.bien{color:var(--cesped)}

/* botones */
.btn{border:1.5px solid var(--tinta);background:var(--papel);border-radius:10px;padding:10px 16px;font-weight:700;min-height:46px;text-align:center}
.btn.pri{background:var(--amarilla);color:var(--sobre-amarilla);border-color:var(--sobre-amarilla)}
.btn.osc{background:var(--tinta);color:var(--grada)}
.btn.peligro{color:var(--roja);border-color:var(--roja)}
.btn.min{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ancho{width:100%}
.fila-btn{display:flex;flex-wrap:wrap;gap:8px}
.fila-btn .btn{flex:1 1 150px}
.enlace{border:0;background:none;padding:6px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:36px}

/* mi estado */
.estado{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--papel);border-radius:12px;padding:12px 14px}
.estado p{flex:1 1 180px;min-width:0;font-weight:600}

/* la pizarra */
.pizarra{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:2px solid var(--tinta);border-radius:14px;overflow:hidden}
.lado{padding:12px 0 6px;min-width:0}
.lado.a{background:var(--blanco);color:#000;--g:var(--gris-en-blanco);--r:var(--raya-en-blanco)}
.lado.b{background:var(--negro);color:#fff;--g:var(--gris-en-negro);--r:var(--raya-en-negro)}
.lado h3{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:0 10px 8px;font-weight:800;font-stretch:125%;font-size:18px;letter-spacing:-.01em}
.lado h3 span{font-weight:600;font-stretch:62%;font-size:15px;color:var(--g)}
.fila{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:6px;min-height:42px;padding:0 10px;border-top:1px solid var(--r);width:100%;text-align:left;background:transparent;border-inline:0;border-bottom:0;color:inherit}
.fila .n{font-stretch:62%;font-weight:700;color:var(--g);font-variant-numeric:tabular-nums}
.fila .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.fila .ext{font-size:13px;font-stretch:75%;color:var(--g);white-space:nowrap}
.fila.yo{background:var(--amarilla);color:#000}
.fila.yo .n,.fila.yo .ext{color:#000}
.fila.libre .nom{font-weight:400;color:var(--g)}
button.fila:hover .nom{text-decoration:underline;text-underline-offset:3px}
.sup{background:var(--papel);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sup h3{font-weight:800;font-stretch:125%;font-size:16px}
.sup ul{display:flex;flex-wrap:wrap;gap:6px}
.ficha{border:1.5px solid var(--raya);background:transparent;border-radius:999px;padding:5px 12px;min-height:34px;font-weight:600;font-size:15px}
.ficha.yo{background:var(--amarilla);color:#000;border-color:#000}
.ficha.on{background:var(--tinta);color:var(--grada);border-color:var(--tinta)}

/* marcador */
.marcador{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;text-align:center}
.marcador .eq{font-weight:800;font-stretch:125%;font-size:16px}
.marcador .num{font-weight:800;font-stretch:62%;font-size:84px;line-height:.9;font-variant-numeric:tabular-nums}
.marcador .raya{font-stretch:62%;font-size:44px;color:var(--gris)}
.mm{display:inline-flex;gap:6px;justify-content:center}
.mm button,.paso button{width:42px;height:42px;border:1.5px solid var(--tinta);border-radius:10px;background:var(--papel);font-weight:800;font-size:20px;line-height:1}
.mm button:disabled,.paso button:disabled{opacity:.35}
.paso{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--raya)}
.paso:first-of-type{border-top:0}
.paso .ctl{display:inline-flex;align-items:center;gap:8px}
.paso output{min-width:28px;text-align:center;font-weight:800;font-stretch:62%;font-size:26px;font-variant-numeric:tabular-nums}
.tarjeta{background:var(--papel);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tarjeta h3{font-weight:800;font-stretch:125%;font-size:16px}

/* cobros */
.cobro{background:var(--tinta);color:var(--grada);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cobro .t{font-weight:800;font-stretch:125%;font-size:22px;line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.cobro .btn{border-color:var(--grada)}
.cobro .ficha{border-color:var(--gris);color:var(--grada)}
.cobro ul{display:flex;flex-wrap:wrap;gap:6px}

/* tablas */
.tablawrap{overflow-x:auto;background:var(--papel);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--raya)}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
thead th{font-weight:600;font-size:13px;color:var(--gris);padding-block:8px}
thead th.izq{text-align:left;padding-left:12px}
thead button{border:0;background:none;padding:4px 2px;font:inherit;color:inherit}
thead th[aria-sort] button{color:var(--tinta);font-weight:800;box-shadow:inset 0 -3px 0 var(--amarilla)}
tbody th{position:sticky;left:0;z-index:1;background:var(--papel);text-align:left;font-weight:600;padding-left:12px;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
tbody th .pos{display:inline-block;width:22px;color:var(--gris);font-stretch:62%;font-weight:700}
tbody td{font-stretch:62%;font-weight:500;font-size:19px;color:var(--gris)}
tbody td.on{color:var(--tinta);font-weight:800}
tbody tr.yo th,tbody tr.yo td{background:var(--amarilla);color:#000}
tbody tr.yo .pos{color:#000}
tbody tr.sin th,tbody tr.sin td{color:var(--gris);font-weight:400}
.racha{display:inline-flex;gap:3px;vertical-align:middle}
.r{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-weight:800;font-size:11px;font-stretch:100%;color:#fff}
.r.v{background:#0a7d45}.r.e{background:#6b6f78}.r.d{background:#c8002a}

/* historial */
.partido{background:var(--papel);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.partido .res{display:flex;align-items:baseline;gap:10px;font-weight:800;font-stretch:62%;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.partido .res small{font-stretch:125%;font-size:14px;font-weight:800}
.partido .res i{font-style:normal;color:var(--gris);font-weight:500}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dos li{font-size:15px;overflow-wrap:anywhere}
.dos li span{color:var(--gris);font-size:13px}

/* formularios */
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-weight:700;font-size:14px}
input[type="text"],input[type="date"],input[type="search"],select,textarea{background:var(--papel);border:1.5px solid var(--tinta);border-radius:10px;padding:10px 12px;min-height:46px;width:100%;max-width:100%}
textarea{min-height:200px;font-size:14px}
.lista-nombres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lista-nombres button{border:1.5px solid var(--tinta);background:var(--papel);border-radius:10px;padding:10px 12px;min-height:48px;font-weight:700;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista-nombres button:disabled{border-color:var(--raya);color:var(--gris);font-weight:400}
.jug{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--raya)}
.jug:first-child{border-top:0}
.jug .q{min-width:0;display:flex;flex-direction:column}
.jug .q b{font-weight:700;overflow-wrap:anywhere}
.jug .q span{font-size:13px;color:var(--gris)}

/* barra inferior */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--papel);border-top:2px solid var(--tinta);padding-bottom:env(safe-area-inset-bottom,0px)}
.barra div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.barra button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--gris);min-height:58px}
.barra svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.barra button[aria-current="page"]{color:var(--tinta);font-weight:800;box-shadow:inset 0 4px 0 var(--amarilla)}

/* hoja inferior */
.velo{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.55);border:0;width:100%;height:100%;cursor:default}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:560px;margin:0 auto;background:var(--papel);border:2px solid var(--tinta);border-bottom:0;border-radius:18px 18px 0 0;padding:18px 16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:86%;overflow-y:auto}
.hoja h2{font-size:20px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;justify-content:center;pointer-events:none}
#toast p{background:var(--tinta);color:var(--grada);padding:10px 14px;border-radius:10px;font-weight:600;max-width:480px}
@media (prefers-reduced-motion:no-preference){
  .hoja{animation:sube .18s ease-out}
  @keyframes sube{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
@media (max-width:360px){.cuando{font-size:26px}.marcador .num{font-size:68px}}
</style>

<script>
/* Datos de prueba con nombres inventados, para enseñar la app sin datos de nadie. */
window.TS_SEED = {
  note: 'Los jugadores y los resultados son inventados.',
  admin: 'u-admin',
  personas: [
    { uid: 'u-admin', label: 'Leo, administrador' },
    { uid: 'u-jugador', label: 'Nico, jugador' },
    { uid: 'u-nuevo', label: 'Un móvil que entra por primera vez' }
  ],
  players: [['Leo', [], 'u-admin', 'med'], ['Nico', [], 'u-jugador', 'def'], ['Bruno', [], null, 'por'], ['Dario', [], null, 'med'], ['Edu', [], null, 'med'], ['Fer', [], null, 'ext'], ['Guille', [], null, 'del'], ['Hugo', [], null, 'def'], ['Iker', [], null, 'med'], ['Joel', [], null, 'ext'], ['Kike', [], null, 'por'], ['Manu', [], null, 'del'], ['Omar', [], null, 'por'], ['Pol', [], null, 'def'], ['Quique', [], null, 'def'], ['Raúl', [], null, 'med'], ['Samu', [], null, 'med'], ['Toni', [], null, 'ext'], ['Unai', [], null, 'del'], ['Víctor', [], null, 'def'], ['Willy', [], null, 'med'], ['Xavi', [], null, 'ext'], ['Yago', [], null, 'por']],
  matches: [
    { date: '2026-10-05', status: 'closed', sa: 3, sb: 4, cob: 'Willy',
      a: [['Bruno', 1], ['Leo', 0, 1, 1, 1], ['Nico', 0, 1, 0, 1], ['Dario', 0, 1, 0, 1], ['Edu', 0, 0, 1, 1], ['Fer', 0, 0, 1, 1], ['Guille', 0], ['Hugo', 0, 0, 0, 1], ['Iker', 0, 0, 0, 1], ['Joel', 0], ['Willy', 0]],
      b: [['Kike', 1], ['Manu', 0, 2, 0, 1], ['Omar', 0, 1, 1, 1], ['Pol', 0, 1, 0, 1], ['Quique', 0, 0, 2, 1], ['Raúl', 0, 0, 1, 1], ['Samu', 0, 0, 0, 1], ['Toni', 0, 0, 0, 1], ['Unai', 0], ['Víctor', 0, 0, 0, 1], ['Xavi', 0, 0, 0, 1]] },
    { date: '2026-10-12', status: 'open',
      a: [['Leo'], ['Nico'], ['Dario'], ['Edu'], ['Fer'], ['Guille'], ['Hugo'], ['Iker'], ['Joel'], ['Willy']],
      b: [['Kike', 1], ['Manu'], ['Omar'], ['Pol'], ['Quique'], ['Raúl'], ['Samu'], ['Toni'], ['Unai'], ['Víctor']] }
  ]
};
</script>
<script>
/* Datos de prueba en memoria para el prototipo. La app real cambia este archivo por la conexión con la base de datos;
   los permisos de aquí son los mismos que tendrán las reglas de seguridad. */
window.createBackend = function () {
  'use strict';
  var db = { players: {}, users: {}, admins: {}, matches: {}, entries: {} };
  var seq = 0, t0 = Date.now() - 3 * 86400000;
  function id(p) { seq++; return p + seq.toString(36) + Math.random().toString(36).slice(2, 6); }
  function add(name, aka, uid, pos) {
    var pid = id('p');
    db.players[pid] = { id: pid, name: name, aka: aka || [], uid: uid || null, guestOf: null, pos: pos || null };
    if (uid) db.users[uid] = pid;
    return pid;
  }
  // Los datos de prueba llegan aparte (window.TS_SEED) para que el código no lleve nombres dentro.
  var seed = window.TS_SEED || { players: [], admin: null, matches: [], personas: [] };
  var N = {};
  seed.players.forEach(function (r) { N[r[0]] = add(r[0], r[1], r[2], r[3]); });
  if (seed.admin) db.admins[seed.admin] = true;
  function entry(t, gk, i, g, a, og, paid) { return { t: t, gk: !!gk, at: t0 + i * 60000, g: g || 0, a: a || 0, og: og || 0, paid: !!paid }; }
  // cada jugador de un partido: [nombre, portero, goles, asistencias, pagado]
  seed.matches.forEach(function (sm, k) {
    var mid = 'm' + sm.date.replace(/-/g, ''), es = {}, fin = null, i = 0;
    ['a', 'b', 's'].forEach(function (t) {
      (sm[t] || []).forEach(function (r) { es[N[r[0]]] = entry(t, r[1], k * 1000 + (i++), r[2], r[3], 0, r[4]); });
    });
    if (sm.status === 'closed') {
      fin = {};
      Object.keys(es).forEach(function (pid, j) { var e = es[pid]; if (e.t !== 's') fin[pid] = { t: e.t, gk: e.gk, g: e.g, a: e.a, og: e.og, o: j }; });
    }
    db.matches[mid] = { id: mid, date: sm.date, time: '20:30', status: sm.status, sa: sm.sa || 0, sb: sm.sb || 0, cob: sm.cob ? N[sm.cob] : null, final: fin };
    db.entries[mid] = es;
  });

  var uid = seed.personas.length ? seed.personas[0].uid : 'u-0', watchers = [];
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function snap() {
    return clone({
      me: { uid: uid, pid: db.users[uid] || null, isAdmin: !!db.admins[uid] },
      players: Object.keys(db.players).map(function (k) { return db.players[k]; }),
      admins: db.admins,
      matches: Object.keys(db.matches).map(function (k) { return db.matches[k]; }),
      entries: db.entries
    });
  }
  function emit() { var s = snap(); watchers.forEach(function (w) { w(s); }); }
  function deny(msg) { var e = new Error(msg || 'No tienes permiso para hacer eso.'); e.code = 'denied'; throw e; }
  function admin() { return !!db.admins[uid]; }
  function mine() { return db.users[uid] || null; }
  function owns(pid) { var p = db.players[pid], me = mine(); return !!p && !!me && (pid === me || p.guestOf === me); }
  function only(patch, keys) { return Object.keys(patch).every(function (k) { return keys.indexOf(k) >= 0; }); }
  function op(fn) {
    return new Promise(function (ok, ko) {
      try { var r = fn(); emit(); ok(r); } catch (e) { ko(e); }
    });
  }

  return {
    mock: true,
    personas: seed.personas,
    note: seed.note || '',
    switchUser: function (u) { uid = u; emit(); },
    watch: function (cb) { watchers.push(cb); cb(snap()); },

    claimPlayer: function (pid) {
      return op(function () {
        var p = db.players[pid];
        if (!p) deny('Ese jugador ya no existe.');
        if (mine()) deny('Este móvil ya está asociado a un jugador.');
        if (p.uid) deny('Ese nombre ya lo ha cogido otro móvil. Pide a un administrador que lo libere.');
        p.uid = uid; db.users[uid] = pid;
      });
    },
    createPlayer: function (data) {
      return op(function () {
        var name = String(data.name || '').trim().slice(0, 30);
        if (!name) deny('Escribe un nombre.');
        var pid = id('p'), p = { id: pid, name: name, aka: [], uid: null, guestOf: null, pos: null };
        if (data.guestOf) {
          if (data.guestOf !== mine() && !admin()) deny();
          p.guestOf = data.guestOf;
        } else if (!admin() || data.self) {
          if (mine()) deny('Este móvil ya está asociado a un jugador.');
          p.uid = uid; db.users[uid] = pid;
        }
        db.players[pid] = p;
        return pid;
      });
    },
    releasePlayer: function (pid) {
      return op(function () {
        var p = db.players[pid];
        if (!p) return;
        if (!admin() && pid !== mine()) deny();
        if (p.uid) delete db.users[p.uid];
        p.uid = null;
      });
    },
    updatePlayer: function (pid, patch) {
      return op(function () {
        if (!admin()) deny();
        var p = db.players[pid];
        if (!p) deny('Ese jugador ya no existe.');
        if (patch.name !== undefined) p.name = String(patch.name).trim().slice(0, 30) || p.name;
        if (patch.aka) p.aka = patch.aka;
      });
    },
    setPosition: function (pid, pos) {
      return op(function () {
        var p = db.players[pid];
        if (!p) deny('Ese jugador ya no existe.');
        if (!admin() && pid !== mine()) deny();
        p.pos = pos || null;
      });
    },
    deletePlayer: function (pid) {
      return op(function () {
        var p = db.players[pid];
        if (!p) return;
        if (!admin() && !(p.guestOf && p.guestOf === mine())) deny();
        Object.keys(db.matches).forEach(function (mid) {
          var m = db.matches[mid];
          if (m.final && m.final[pid]) deny('Tiene partidos cerrados; se puede renombrar, pero no borrar.');
        });
        Object.keys(db.entries).forEach(function (mid) { delete db.entries[mid][pid]; });
        if (p.uid) delete db.users[p.uid];
        delete db.players[pid];
      });
    },
    setAdmin: function (pid, on) {
      return op(function () {
        if (!admin()) deny();
        var p = db.players[pid];
        if (!p || !p.uid) deny('Primero tiene que entrar en la app y elegir su nombre.');
        if (!on && p.uid === uid) deny('No puedes quitarte a ti mismo de administrador.');
        if (on) db.admins[p.uid] = true; else delete db.admins[p.uid];
      });
    },
    createMatch: function (data) {
      return op(function () {
        if (!admin()) deny();
        var mid = 'm' + String(data.date).replace(/-/g, '') + id('');
        db.matches[mid] = { id: mid, date: data.date, time: data.time || '20:30', status: 'open', sa: 0, sb: 0, cob: null, final: null };
        db.entries[mid] = {};
        return mid;
      });
    },
    updateMatch: function (mid, patch) {
      return op(function () {
        if (!admin()) deny();
        var m = db.matches[mid];
        if (!m) deny('Ese partido ya no existe.');
        Object.keys(patch).forEach(function (k) { m[k] = patch[k]; });
      });
    },
    deleteMatch: function (mid) {
      return op(function () {
        if (!admin()) deny();
        delete db.matches[mid]; delete db.entries[mid];
      });
    },
    setEntry: function (mid, pid, data) {
      return op(function () {
        var m = db.matches[mid];
        if (!m) deny('Ese partido ya no existe.');
        if (!admin() && !(owns(pid) && m.status === 'open')) deny(m.status === 'open' ? undefined : 'La convocatoria ya está cerrada.');
        db.entries[mid][pid] = { t: data.t, gk: !!data.gk, at: data.at || Date.now(), g: 0, a: 0, og: 0, paid: false };
      });
    },
    updateEntry: function (mid, pid, patch) {
      return op(function () {
        var m = db.matches[mid], e = m && db.entries[mid][pid];
        if (!e) deny('Ese jugador ya no está en el partido.');
        if (!admin()) {
          if (!owns(pid)) deny();
          var ok = m.status === 'open' ? only(patch, ['t', 'gk']) : m.status === 'review' ? only(patch, ['g', 'a', 'og', 'paid']) : only(patch, ['paid']);
          if (!ok) deny('Eso solo puede cambiarlo un administrador.');
        }
        Object.keys(patch).forEach(function (k) { e[k] = patch[k]; });
      });
    },
    deleteEntry: function (mid, pid) {
      return op(function () {
        var m = db.matches[mid];
        if (!m || !db.entries[mid][pid]) return;
        if (!admin() && !(owns(pid) && m.status === 'open')) deny();
        delete db.entries[mid][pid];
      });
    }
  };
};
</script>
<script>
(function () {
  'use strict';
  var FEE = 5, CAP = 11, TEAM = { a: 'Blancos', b: 'Negros', s: 'Suplentes' };
  var POS = { por: 'Portero', def: 'Defensa', med: 'Mediocampista', ext: 'Extremo', del: 'Delantero' };
  var app = document.getElementById('app');
  var B = window.createBackend();
  var S = { loading: true, me: { uid: null, pid: null, isAdmin: false }, players: [], admins: {}, matches: [], entries: {} };
  var idx = {};
  var ui = { tab: 'partido', sort: 'g', onboarding: false, pending: null, sheet: null, confirm: null, newName: '', guestName: '', guestTeam: 's', newDate: '', rename: '' };

  /* ---------- utilidades ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function byName(a, b) { return a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }); }
  function nameOf(pid) { return idx[pid] ? idx[pid].name : 'Jugador borrado'; }
  function norm(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
  function iso(d) { var m = d.getMonth() + 1, x = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (x < 10 ? '0' : '') + x; }
  function nextMonday() {
    // el primer lunes que quede libre: después de hoy y del último partido que ya exista
    var d = new Date(), last = S.matches.map(function (m) { return m.date; }).sort().pop();
    if (last) { var l = new Date(last + 'T12:00:00'); l.setDate(l.getDate() + 1); if (l > d) d = l; }
    d.setDate(d.getDate() + ((8 - d.getDay()) % 7));
    return iso(d);
  }
  function fmt(s, opts) {
    var d = new Date(s + 'T12:00:00');
    if (isNaN(d)) return s;
    try { var t = new Intl.DateTimeFormat('es-ES', opts).format(d).replace(',', ''); return t.charAt(0).toUpperCase() + t.slice(1); } catch (e) { return s; }
  }
  function largo(s) { return fmt(s, { weekday: 'long', day: 'numeric', month: 'long' }); }
  function corto(s) { return fmt(s, { weekday: 'short', day: 'numeric', month: 'short' }).toLowerCase(); }
  function lista(names) {
    if (names.length < 2) return names.join('');
    return names.slice(0, -1).join(', ') + ' y ' + names[names.length - 1];
  }
  function num(n, d) { try { return n.toLocaleString('es-ES', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); } catch (e) { return String(n); } }

  /* ---------- lectura de datos ---------- */
  function sorted() { return S.matches.slice().sort(function (m, n) { return m.date < n.date ? -1 : m.date > n.date ? 1 : (m.id < n.id ? -1 : 1); }); }
  function closed() { return sorted().filter(function (m) { return m.status === 'closed' && m.final; }); }
  function ents(mid) { return S.entries[mid] || {}; }
  function side(m, t) {
    var src = m.status === 'closed' && m.final ? m.final : ents(m.id), out = [];
    Object.keys(src).forEach(function (pid) { if (src[pid].t === t) out.push({ pid: pid, e: src[pid] }); });
    return out.sort(function (x, y) {
      return ((y.e.gk ? 1 : 0) - (x.e.gk ? 1 : 0)) || ((x.e.at || x.e.o || 0) - (y.e.at || y.e.o || 0)) || nameOf(x.pid).localeCompare(nameOf(y.pid), 'es');
    });
  }
  function declared(m, t) {
    var o = t === 'a' ? 'b' : 'a', n = 0;
    side(m, t).forEach(function (x) { n += x.e.g || 0; });
    side(m, o).forEach(function (x) { n += x.e.og || 0; });
    return n;
  }
  function owns(pid) { var p = idx[pid], me = S.me.pid; return !!p && !!me && (pid === me || p.guestOf === me); }
  function room(m, t, gk, moving) {
    if (t === 's') return true;
    // Caben 11 por equipo, con portero o sin él: si se juega sin portero, los 11 pueden ser de campo.
    var s = side(m, t).filter(function (x) { return x.pid !== moving; });
    if (s.length >= CAP) return false;
    return gk ? !s.some(function (x) { return x.e.gk; }) : true;
  }
  function dues(m) {
    var payers = side(m, 'a').concat(side(m, 'b')).filter(function (x) { return !x.e.gk; }).map(function (x) { return x.pid; });
    if (m.settled) return { payers: payers, unpaid: [] };
    if (!S.entries[m.id]) return { payers: payers, unpaid: [], unknown: true };
    var es = ents(m.id);
    return { payers: payers, unpaid: payers.filter(function (pid) { return pid !== m.cob && !(es[pid] && es[pid].paid); }) };
  }
  function stats() {
    var rows = {};
    S.players.forEach(function (p) { rows[p.id] = { id: p.id, name: p.name, pj: 0, v: 0, e: 0, d: 0, g: 0, a: 0, ga: 0, pp: 0, pts: 0, gkpj: 0, gc: 0, cs: 0, form: [] }; });
    closed().forEach(function (m) {
      [['a', m.sa || 0, m.sb || 0], ['b', m.sb || 0, m.sa || 0]].forEach(function (t) {
        var res = t[1] > t[2] ? 'v' : t[1] < t[2] ? 'd' : 'e';
        side(m, t[0]).forEach(function (x) {
          var r = rows[x.pid];
          if (!r) return;
          r.pj++; r[res]++; r.form.push(res);
          r.g += x.e.g || 0; r.a += x.e.a || 0; r.pp += x.e.og || 0;
          if (x.e.gk) { r.gkpj++; r.gc += t[2]; if (!t[2]) r.cs++; }
        });
      });
    });
    return S.players.map(function (p) { var r = rows[p.id]; r.ga = r.g + r.a; r.pts = r.v * 3 + r.e; return r; });
  }

  /* ---------- avisos y llamadas ---------- */
  var toastEl = null, toastT = null;
  function toast(msg) {
    if (!toastEl) { toastEl = document.createElement('div'); toastEl.id = 'toast'; toastEl.setAttribute('role', 'status'); document.body.appendChild(toastEl); }
    toastEl.innerHTML = '<p>' + esc(msg) + '</p>';
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.innerHTML = ''; }, 4500);
  }
  function run(promise, okMsg) {
    return promise.then(function (r) { if (okMsg) toast(okMsg); return r; }, function (e) {
      toast(e && e.code === 'denied' ? e.message : 'No se ha podido guardar. Comprueba la conexión y vuelve a intentarlo.');
      return null;
    });
  }

  /* ---------- piezas de pantalla ---------- */
  var ICON = {
    partido: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M12 9.5a2.5 2.5 0 0 1 0 5a2.5 2.5 0 0 1 0-5"/></svg>',
    tabla: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
    partidos: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    yo: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'
  };
  function protoBar() {
    if (!B.personas) return '';
    return '<div class="proto"><label for="persona">Prototipo. Ver como</label><select id="persona" data-in="persona">' +
      B.personas.map(function (p) { return '<option value="' + p.uid + '"' + (p.uid === S.me.uid ? ' selected' : '') + '>' + esc(p.label) + '</option>'; }).join('') +
      '</select><p>Datos de prueba que se reinician al recargar. ' + esc(B.note || '') + '</p></div>';
  }
  function header() {
    return '<header class="cab"><p class="marca">Talento<b>SEK</b></p>' +
      (S.me.pid ? '<button class="quien" data-act="tab" data-t="yo" data-fk="quien">' + esc(nameOf(S.me.pid)) + '</button>'
        : '<button class="quien" data-act="identify" data-fk="quien">Elegir quién soy</button>') + '</header>';
  }
  function tabbar() {
    var L = { partido: 'Partido', tabla: 'Tabla', partidos: 'Jugados', yo: 'Yo' };
    return '<nav class="barra" aria-label="Secciones"><div>' + Object.keys(L).map(function (t) {
      return '<button data-act="tab" data-t="' + t + '" data-fk="tab-' + t + '"' + (ui.tab === t && !ui.onboarding ? ' aria-current="page"' : '') + '>' + ICON[t] + L[t] + '</button>';
    }).join('') + '</div></nav>';
  }
  function stepRow(label, value, attrs, key, max) {
    return '<div class="paso"><span>' + label + '</span><span class="ctl">' +
      '<button type="button" ' + attrs + ' data-d="-1" data-fk="' + key + '-m" aria-label="Quitar uno de ' + label.toLowerCase() + '"' + (value <= 0 ? ' disabled' : '') + '>−</button>' +
      '<output>' + value + '</output>' +
      '<button type="button" ' + attrs + ' data-d="1" data-fk="' + key + '-p" aria-label="Añadir uno a ' + label.toLowerCase() + '"' + (value >= (max || 30) ? ' disabled' : '') + '>+</button></span></div>';
  }

  /* ---------- la pizarra ---------- */
  function extra(m, x) {
    var p = idx[x.pid] || {};
    if (m.status === 'open') return x.e.gk ? 'portero' : p.guestOf ? 'inv.' : (p.pos && POS[p.pos] ? p.pos + '.' : '');   // abreviado para no comerse el nombre
    var bits = [];
    if (x.e.g) bits.push(x.e.g + 'g');
    if (x.e.a) bits.push(x.e.a + 'a');
    if (x.e.og) bits.push(x.e.og + 'pp');
    return bits.join(' ') || (x.e.gk ? 'portero' : '');
  }
  function fila(m, n, x) {
    var can = m.status !== 'closed' && (S.me.isAdmin || owns(x.pid));
    var inner = '<span class="n">' + n + '</span><span class="nom">' + esc(nameOf(x.pid)) + '</span><span class="ext">' + extra(m, x) + '</span>';
    var cls = 'fila' + (x.pid === S.me.pid ? ' yo' : '');
    return can
      ? '<li><button class="' + cls + '" data-act="sheet-entry" data-mid="' + m.id + '" data-pid="' + x.pid + '" data-fk="f-' + m.id + x.pid + '">' + inner + '</button></li>'
      : '<li><div class="' + cls + '">' + inner + '</div></li>';
  }
  function libre(m, t, n, gk, full) {
    var label = gk ? 'Falta portero' : 'Libre';
    if (m.status !== 'open' || full) return gk ? '<li><div class="fila libre"><span class="n">1</span><span class="nom">Sin portero</span><span class="ext"></span></div></li>' : '';
    return '<li><button class="fila libre" data-act="join" data-mid="' + m.id + '" data-t="' + t + '" data-gk="' + (gk ? 1 : 0) + '" data-fk="l-' + t + n + '" aria-label="' +
      (gk ? 'Ponerme de portero en ' : 'Apuntarme en ') + TEAM[t] + '"><span class="n">' + n + '</span><span class="nom">' + label + '</span><span class="ext"></span></button></li>';
  }
  function lado(m, t) {
    var s = side(m, t), gk = s.filter(function (x) { return x.e.gk; })[0], field = s.filter(function (x) { return !x.e.gk; }), html = '';
    var full = s.length >= CAP;
    html += gk ? fila(m, 1, gk) : libre(m, t, 1, true, full);
    var rows = m.status === 'open' ? CAP - 1 : field.length;
    for (var i = 0; i < Math.max(rows, field.length); i++) html += field[i] ? fila(m, i + 2, field[i]) : libre(m, t, i + 2, false, full);
    return '<section class="lado ' + t + '" aria-label="' + TEAM[t] + '"><h3>' + TEAM[t] + ' <span>' + s.length + (m.status === 'open' ? ' de ' + CAP : '') + '</span></h3><ol>' + html + '</ol></section>';
  }
  function pizarra(m) { return '<div class="pizarra">' + lado(m, 'a') + lado(m, 'b') + '</div>'; }

  /* ---------- pestaña Partido ---------- */
  function cobros() {
    var ms = closed().reverse().filter(function (m) { return !!m.cob; });
    return ms.map(function (m, i) {
      var d = dues(m);
      if (d.unknown || (!d.unpaid.length && i > 0)) return '';
      var meOwes = d.unpaid.indexOf(S.me.pid) >= 0;
      return '<section class="cobro" aria-label="Pagos"><p class="t">Cobra ' + esc(nameOf(m.cob)) + '</p>' +
        '<p>' + FEE + ' € por Bizum del partido del ' + esc(largo(m.date).toLowerCase()) + '. ' +
        (d.unpaid.length ? 'Faltan por pagar ' + d.unpaid.length + ' (' + (d.unpaid.length * FEE) + ' €).' : 'Han pagado todos.') + '</p>' +
        (d.unpaid.length ? '<ul>' + d.unpaid.map(function (pid) {
          return S.me.isAdmin
            ? '<li><button class="ficha" data-act="pay" data-mid="' + m.id + '" data-pid="' + pid + '" data-v="1" data-fk="pay-' + m.id + pid + '" aria-label="Marcar que ' + esc(nameOf(pid)) + ' ha pagado">' + esc(nameOf(pid)) + '</button></li>'
            : '<li><span class="ficha">' + esc(nameOf(pid)) + '</span></li>';
        }).join('') + '</ul>' : '') +
        (S.me.isAdmin && d.unpaid.length ? '<p class="nota" style="color:inherit;opacity:.8">Toca un nombre cuando te haya pagado.</p>' : '') +
        (meOwes ? '<button class="btn pri" data-act="pay" data-mid="' + m.id + '" data-pid="' + S.me.pid + '" data-v="1" data-fk="yapague-' + m.id + '">Ya he pagado</button>' : '') +
        '</section>';
    }).join('');
  }
  function miEstado(m) {
    if (!S.me.pid) return '<div class="estado"><p>Elige quién eres para apuntarte.</p><button class="btn pri" data-act="identify" data-fk="ident2">Elegir quién soy</button></div>';
    var e = ents(m.id)[S.me.pid], ask = idx[S.me.pid] && !idx[S.me.pid].pos
      ? '<div class="estado"><p>Todavía no has dicho de qué juegas.</p><button class="btn min" data-act="ask-pos" data-fk="askpos">Elegir posición</button></div>' : '';
    if (!e) return ask + '<div class="estado"><p>No estás apuntado. Toca un hueco libre de la pizarra.</p></div>';
    var txt = e.t === 's' ? 'Estás de suplente.' : e.gk ? 'Eres el portero de ' + TEAM[e.t] + '.' : 'Juegas con ' + TEAM[e.t] + '.';
    return ask + '<div class="estado"><p>' + txt + '</p><button class="btn min" data-act="leave" data-mid="' + m.id + '" data-pid="' + S.me.pid + '" data-fk="salir">Borrarme</button></div>';
  }
  function suplentes(m) {
    var s = side(m, 's'), meIn = !!ents(m.id)[S.me.pid];
    return '<div class="sup"><h3>Suplentes</h3>' +
      (s.length ? '<ul>' + s.map(function (x) {
        var can = S.me.isAdmin || owns(x.pid), cls = 'ficha' + (x.pid === S.me.pid ? ' yo' : '');
        return '<li>' + (can ? '<button class="' + cls + '" data-act="sheet-entry" data-mid="' + m.id + '" data-pid="' + x.pid + '" data-fk="f-' + m.id + x.pid + '">' + esc(nameOf(x.pid)) + '</button>'
          : '<span class="' + cls + '">' + esc(nameOf(x.pid)) + '</span>') + '</li>';
      }).join('') + '</ul>' : '<p class="nota">Nadie todavía.</p>') +
      (m.status === 'open' && S.me.pid && !meIn ? '<button class="enlace" data-act="join" data-mid="' + m.id + '" data-t="s" data-gk="0" data-fk="join-s">Apuntarme de suplente</button>' : '') + '</div>';
  }
  function convocatoria(m) {
    var n = side(m, 'a').length + side(m, 'b').length;
    return '<section class="vista" aria-label="Convocatoria"><div class="bloque"><h1 class="cuando">' + esc(largo(m.date)) + '</h1>' +
      '<p class="donde">A las ' + esc(m.time || '20:30') + ' en el SEK. Hay ' + n + ' apuntados de ' + (CAP * 2) + '.</p></div>' +
      miEstado(m) + pizarra(m) + suplentes(m) +
      '<div class="fila-btn">' + (S.me.pid ? '<button class="btn" data-act="sheet" data-k="guest" data-mid="' + m.id + '" data-fk="inv">Traer a un invitado</button>' : '') +
      '<button class="btn" data-act="copy" data-mid="' + m.id + '" data-fk="copy">Copiar lista para WhatsApp</button></div>' +
      (S.me.isAdmin ? '<div class="tarjeta"><h3>Administrar</h3><p class="nota">Toca cualquier nombre para moverlo o quitarlo. Cuando acabe el partido, pásalo a resultado para que cada uno apunte lo suyo.</p>' +
        '<div class="fila-btn"><button class="btn osc" data-act="status" data-mid="' + m.id + '" data-v="review" data-fk="jugado">Ya se ha jugado</button>' +
        (ui.confirm === 'del-' + m.id
          ? '<button class="btn peligro" data-act="del-match" data-mid="' + m.id + '" data-fk="delyes">Sí, borrar</button><button class="btn" data-act="confirm" data-v="" data-fk="delno">Cancelar</button>'
          : '<button class="btn peligro" data-act="confirm" data-v="del-' + m.id + '" data-fk="del">Borrar convocatoria</button>') + '</div></div>' : '') +
      '</section>';
  }
  function cuadre(m) {
    return ['a', 'b'].map(function (t) {
      var off = t === 'a' ? (m.sa || 0) : (m.sb || 0), dec = declared(m, t);
      if (dec === off) return '';
      return dec < off
        ? '<p class="aviso">A ' + TEAM[t] + ' le ' + (off - dec === 1 ? 'falta 1 gol' : 'faltan ' + (off - dec) + ' goles') + ' por apuntar.</p>'
        : '<p class="aviso mal">' + TEAM[t] + ' tiene ' + (dec - off === 1 ? '1 gol apuntado' : (dec - off) + ' goles apuntados') + ' de más.</p>';
    }).join('') || '<p class="aviso bien">Los goles apuntados cuadran con el marcador.</p>';
  }
  function misNumeros(m) {
    var e = ents(m.id)[S.me.pid];
    if (!e || e.t === 's') return '';
    var at = 'data-act="num" data-mid="' + m.id + '" data-pid="' + S.me.pid + '"';
    return '<div class="tarjeta"><h3>Tus números</h3>' +
      stepRow('Goles', e.g || 0, at + ' data-k="g"', 'yo-g') + stepRow('Asistencias', e.a || 0, at + ' data-k="a"', 'yo-a') + stepRow('En propia puerta', e.og || 0, at + ' data-k="og"', 'yo-og', 9) +
      '</div>';
  }
  function pagosCard(m) {
    var es = ents(m.id), d = dues(m), all = side(m, 'a').concat(side(m, 'b'));
    var who = m.cob ? '<p class="aviso">Cobra ' + esc(nameOf(m.cob)) + '. Son ' + FEE + ' € por Bizum.</p>' : '<p class="aviso">Todavía no se ha dicho quién cobra.</p>';
    var sel = S.me.isAdmin ? '<div class="campo"><label for="cob-' + m.id + '">¿Quién cobra?</label><select id="cob-' + m.id + '" data-in="cob" data-mid="' + m.id + '"><option value="">Sin decidir</option>' +
      all.map(function (x) { return '<option value="' + x.pid + '"' + (m.cob === x.pid ? ' selected' : '') + '>' + esc(nameOf(x.pid)) + '</option>'; }).join('') + '</select></div>' : '';
    var chips = d.payers.map(function (pid) {
      if (pid === m.cob) return '';
      var on = !!(es[pid] && es[pid].paid), can = S.me.isAdmin || owns(pid), label = esc(nameOf(pid)) + (on ? ' ✓' : '');
      return '<li>' + (can

      if (el && !el.disabled) {
        el.focus();
        if (keep.s != null && el.setSelectionRange) { try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} }
      }
    }
  }

  /* ---------- acciones ---------- */
  function match(mid) { return S.matches.filter(function (m) { return m.id === mid; })[0]; }
  function whatsapp(m) {
    var out = [largo(m.date) + ' ' + (m.time || '20:30') + ' SEK', 'Bizum ' + FEE + ' euros', ''];
    ['a', 'b'].forEach(function (t) {
      var s = side(m, t), gk = s.filter(function (x) { return x.e.gk; })[0], field = s.filter(function (x) { return !x.e.gk; });
      out.push(TEAM[t].toUpperCase());
      out.push('1. ' + (gk ? nameOf(gk.pid) : ''));
      for (var i = 0; i < Math.max(CAP - 1, field.length); i++) out.push((i + 2) + '. ' + (field[i] ? nameOf(field[i].pid) : ''));
      out.push('');
    });
    out.push('Suplentes:');
    side(m, 's').forEach(function (x) { out.push(nameOf(x.pid)); });
    return out.join('\n');
  }
  var act = {
    tab: function (b) { ui.tab = b.dataset.t; ui.onboarding = false; ui.pending = null; ui.confirm = null; ui.sheet = null; render(); try { window.scrollTo(0, 0); } catch (e) {} },
    sort: function (b) { ui.sort = b.dataset.k; render(); },
    identify: function () { ui.onboarding = true; ui.pending = null; ui.sheet = null; render(); try { window.scrollTo(0, 0); } catch (e) {} },
    browse: function () { ui.onboarding = false; render(); },
    confirm: function (b) { ui.confirm = b.dataset.v || null; render(); },
    'close-sheet': function () { ui.sheet = null; render(); },
    sheet: function (b) {
      ui.sheet = { k: b.dataset.k, mid: b.dataset.mid, pid: b.dataset.pid };
      if (b.dataset.k === 'player' && idx[b.dataset.pid]) ui.rename = idx[b.dataset.pid].name;
      if (b.dataset.k === 'guest') { ui.guestName = ''; ui.guestTeam = 's'; }
      render();
    },
    'sheet-entry': function (b) { ui.sheet = { k: 'entry', mid: b.dataset.mid, pid: b.dataset.pid }; render(); },
    claim: function (b) { ui.pending = { pid: b.dataset.pid }; render(); try { window.scrollTo(0, 0); } catch (e) {} },
    'ask-pos': function () { ui.pending = { pid: S.me.pid, mine: true }; ui.onboarding = true; render(); try { window.scrollTo(0, 0); } catch (e) {} },
    'pos-back': function () { if (ui.pending && ui.pending.mine) ui.onboarding = false; ui.pending = null; render(); },
    'pick-pos': function (b) {
      var pend = ui.pending, pos = b.dataset.v;
      if (!pend || !POS[pos]) return;
      // Primero el nombre y después la posición: si la posición no se puede guardar, la entrada sigue valiendo.
      var who = pend.mine ? Promise.resolve(pend.pid)
        : pend.pid ? B.claimPlayer(pend.pid).then(function () { return pend.pid; })
        : B.createPlayer({ name: pend.name, self: true });
      who.then(function (pid) {
        return B.setPosition(pid, pos).then(function () { return [pid, true]; }, function () { return [pid, false]; });
      }).then(function (r) {
        ui.pending = null; ui.onboarding = false; ui.newName = '';
        if (!pend.mine) ui.tab = 'partido';
        toast(!r[1] ? 'Has entrado como ' + nameOf(r[0]) + ', pero la posición no se ha guardado. Elígela más tarde en la pestaña Yo.'
          : pend.mine ? 'Posición guardada: ' + POS[pos].toLowerCase() + '.' : 'Hecho. Este móvil es ' + nameOf(r[0]) + ', ' + POS[pos].toLowerCase() + '.');
        render();
      }, function (e) {
        ui.pending = null;
        toast(e && e.code === 'denied' ? e.message : 'No se ha podido guardar. Comprueba la conexión y vuelve a intentarlo.');
        render();
      });
    },
    join: function (b) {
      var m = match(b.dataset.mid), t = b.dataset.t, gk = b.dataset.gk === '1', pid = S.me.pid;
      if (!pid) { ui.onboarding = true; render(); return; }
      if (!m || m.status !== 'open') return;
      if (!room(m, t, gk, pid)) { toast(gk ? 'Ese equipo ya tiene portero.' : TEAM[t] + ' está completo. Puedes apuntarte de suplente.'); return; }
      var e = ents(m.id)[pid];
      run(e ? B.updateEntry(m.id, pid, { t: t, gk: gk }) : B.setEntry(m.id, pid, { t: t, gk: gk, at: Date.now() }),
        t === 's' ? 'Apuntado de suplente.' : gk ? 'Apuntado de portero en ' + TEAM[t] + '.' : 'Apuntado en ' + TEAM[t] + '.');
    },
    move: function (b) {
      var m = match(b.dataset.mid), t = b.dataset.t, gk = b.dataset.gk === '1';
      if (!m) return;
      if (!room(m, t, gk, b.dataset.pid)) { toast(gk ? 'Ese equipo ya tiene portero.' : TEAM[t] + ' está completo.'); return; }
      ui.sheet = null;
      run(B.updateEntry(m.id, b.dataset.pid, { t: t, gk: gk }));
    },
    leave: function (b) {
      ui.sheet = null;
      var mid = b.dataset.mid, pid = b.dataset.pid;
      run(B.deleteEntry(mid, pid), pid === S.me.pid ? 'Te has borrado del partido.' : nameOf(pid) + ' ya no está en el partido.');
    },
    copy: function (b) {
      var m = match(b.dataset.mid);
      if (!m) return;
      var text = whatsapp(m);
      var fail = function () { ui.sheet = { k: 'wa', text: text }; render(); };
      try { navigator.clipboard.writeText(text).then(function () { toast('Lista copiada. Pégala en el grupo.'); }, fail); } catch (e) { fail(); }
    },
    status: function (b) {
      ui.confirm = null;
      run(B.updateMatch(b.dataset.mid, { status: b.dataset.v, settled: false }), b.dataset.v === 'review' ? 'Listo. Ya se pueden apuntar goles y pagos.' : 'Convocatoria abierta otra vez.').then(function () {
        if (b.dataset.v === 'review') { ui.tab = 'partido'; render(); }
      });
    },
    'del-match': function (b) { ui.confirm = null; run(B.deleteMatch(b.dataset.mid), 'Borrado.'); },
    score: function (b) {
      var m = match(b.dataset.mid), k = b.dataset.t === 'a' ? 'sa' : 'sb', patch = {};
      if (!m) return;
      patch[k] = Math.max(0, Math.min(40, (m[k] || 0) + (+b.dataset.d)));
      run(B.updateMatch(m.id, patch));
    },
    num: function (b) {
      var e = ents(b.dataset.mid)[b.dataset.pid], k = b.dataset.k, patch = {};
      if (!e) return;
      patch[k] = Math.max(0, Math.min(k === 'og' ? 9 : 30, (e[k] || 0) + (+b.dataset.d)));
      run(B.updateEntry(b.dataset.mid, b.dataset.pid, patch));
    },
    pay: function (b) {
      var on = b.dataset.v === '1';
      run(B.updateEntry(b.dataset.mid, b.dataset.pid, { paid: on }), b.dataset.pid === S.me.pid && on ? 'Apuntado: has pagado.' : null);
    },
    close: function (b) {
      var m = match(b.dataset.mid), final = {};
      if (!m) return;
      if (!side(m, 'a').length || !side(m, 'b').length) { toast('Hace falta al menos un jugador en cada equipo.'); return; }
      ['a', 'b'].forEach(function (t) {
        side(m, t).forEach(function (x, i) { final[x.pid] = { t: t, gk: !!x.e.gk, g: x.e.g || 0, a: x.e.a || 0, og: x.e.og || 0, o: (t === 'a' ? 0 : 100) + i }; });
      });
      ui.confirm = null;
      run(B.updateMatch(m.id, { status: 'closed', final: final }), 'Partido cerrado. Ya cuenta en la tabla.').then(function () { ui.tab = 'tabla'; render(); });
    },
    bootstrap: function () { run(B.bootstrapAdmin(), 'Hecho. Ya eres administrador.'); },
    'release-me': function () { ui.confirm = null; run(B.releasePlayer(S.me.pid)).then(function () { ui.onboarding = true; render(); }); },
    release: function (b) { ui.sheet = null; run(B.releasePlayer(b.dataset.pid), 'Móvil liberado. El nombre vuelve a estar libre.'); },
    admin: function (b) { ui.sheet = null; run(B.setAdmin(b.dataset.pid, b.dataset.v === '1'), b.dataset.v === '1' ? nameOf(b.dataset.pid) + ' ya es administrador.' : 'Hecho.'); },
    'del-player': function (b) { var n = nameOf(b.dataset.pid); ui.sheet = null; run(B.deletePlayer(b.dataset.pid), n + ' borrado.'); }
  };
  var forms = {
    'new-player': function () {
      var name = ui.newName.trim().replace(/\s+/g, ' ');
      if (!name) { toast('Escribe tu nombre.'); return; }
      if (S.players.some(function (p) { return norm(p.name) === norm(name); })) { toast('Ya hay un ' + name + ' en la lista. Elígelo arriba o añade un apellido.'); return; }
      ui.pending = { name: name }; render(); try { window.scrollTo(0, 0); } catch (e) {}
    },
    guest: function () {
      var name = ui.guestName.trim().replace(/\s+/g, ' '), sh = ui.sheet, m = sh && match(sh.mid), t = ui.guestTeam;
      if (!name || !m) { toast('Escribe el nombre del invitado.'); return; }
      if (S.players.some(function (p) { return norm(p.name) === norm(name); })) { toast('Ya hay un ' + name + ' en la lista. Añade un apellido para distinguirlo.'); return; }
      if (!room(m, t, false, null)) { toast(TEAM[t] + ' está completo. Apúntalo de suplente.'); return; }
      ui.sheet = null;
      run(B.createPlayer({ name: name, guestOf: S.me.pid })).then(function (pid) {
        if (pid) run(B.setEntry(m.id, pid, { t: t, gk: false, at: Date.now() }), name + ' apuntado en ' + TEAM[t].toLowerCase() + '.');
      });
    },
    rename: function () {
      var sh = ui.sheet, name = ui.rename.trim().replace(/\s+/g, ' ');
      if (!sh || !name) return;
      if (S.players.some(function (p) { return p.id !== sh.pid && norm(p.name) === norm(name); })) { toast('Ya hay otro jugador con ese nombre.'); return; }
      ui.sheet = null;
      run(B.updatePlayer(sh.pid, { name: name }), 'Nombre cambiado.');
    },
    'open-match': function () {
      var d = ui.newDate || nextMonday();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast('Pon la fecha del partido.'); return; }
      run(B.createMatch({ date: d, time: '20:30' }), 'Convocatoria abierta.');
    }
  };
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!b || b.disabled || !app.contains(b)) return;
    if (act[b.dataset.act]) act[b.dataset.act](b);
  });
  app.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target.closest('[data-form]');
    if (f && forms[f.dataset.form]) forms[f.dataset.form]();
  });
  function onInput(ev) {
    var el = ev.target, k = el && el.dataset ? el.dataset['in'] : null;
    if (!k) return;
    if (k === 'q') {
      var q = norm(el.value), items = document.querySelectorAll('#nombres li');
      for (var i = 0; i < items.length; i++) items[i].hidden = !!q && items[i].dataset.n.indexOf(q) < 0;
    } else if (k === 'persona') {
      if (ev.type === 'change') { ui.onboarding = false; ui.pending = null; ui.sheet = null; ui.confirm = null; B.switchUser(el.value); }
    } else if (k === 'mypos' || k === 'ppos') {
      if (ev.type === 'change' && (!el.value || POS[el.value])) run(B.setPosition(el.dataset.pid, el.value || null), 'Posición guardada.');
    } else if (k === 'cob') {
      if (ev.type === 'change') run(B.updateMatch(el.dataset.mid, { cob: el.value || null }));
    } else if (k in ui) {
      ui[k] = el.value;
    }
  }
  app.addEventListener('input', onInput);
  app.addEventListener('change', onInput);
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); } });

  var settling = {};
  function settle() {
    if (!S.me.isAdmin) return;
    closed().forEach(function (m) {
      if (!m.cob || m.settled || settling[m.id]) return;
      var d = dues(m);
      if (d.unknown || d.unpaid.length) return;
      settling[m.id] = true;
      B.updateMatch(m.id, { settled: true }).then(null, function () { delete settling[m.id]; });
    });
  }
  B.watch(function (s) { S = s; render(); if (!S.loading && !S.error) settle(); });
})();
</script>
</body>
</html>
